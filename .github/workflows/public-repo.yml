name: Mirror TranslateSense Main Branch

on:
  push:
    branches:
      - main

jobs:
  sync-to-secondary:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Rewrite History and Remove Private Files
        run: |
          git filter-branch --force \
            --tree-filter '
              # Remove GitHub workflow and configuration files
              rm -rf .github

              # Remove all private JavaScript files from every commit
              find . -type f -name "*-private.js" \
                -not -path "./.git/*" -delete

              # Remove the private JS export-ignore rule
              if [ -f .gitattributes ]; then
                sed -i "/^[[:space:]]*\\*-private\\.js[[:space:]]\\+export-ignore[[:space:]]*$/d" .gitattributes
              fi
            ' \
            --env-filter '
              export GIT_AUTHOR_NAME="dragwyb"
              export GIT_AUTHOR_EMAIL="dragwyb@gmail.com"
              export GIT_COMMITTER_NAME="dragwyb"
              export GIT_COMMITTER_EMAIL="dragwyb@gmail.com"
            ' HEAD

      - name: Push to Public TranslateSense Repository
        env:
          SEC_TOKEN: ${{ secrets.SECONDARY_REPO_TOKEN }}
        run: |
          REMOTE_URL="https://x-access-token:${SEC_TOKEN}@github.com/Dragwyb/translatesense.git"

          git remote add secondary "$REMOTE_URL"

          git push --force secondary HEAD:refs/heads/main
